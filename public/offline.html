<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08211a" />
    <title>Internet aloqasi yo‘q — Bobo&amp;Doda</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f4f1e8; color: #08211a;
        font: 16px/1.55 system-ui, sans-serif; padding: 24px;
      }
      main {
        width: min(100%, 480px); background: #fff; border: 1px solid #d9d6cc;
        border-radius: 18px; padding: 32px; box-shadow: 0 18px 50px #08211a12;
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; color: #52615c; }
      button {
        border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer;
        background: #0e684e; color: #fff; font: inherit; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Internet aloqasi uzildi</h1>
      <p>Ulanish tiklangach sahifani qayta yuklang. Saqlangan ma’lumotlaringiz o‘chirilmaydi.</p>
      <button type="button" onclick="location.reload()">Qayta urinish</button>
    </main>
  </body>
</html>
