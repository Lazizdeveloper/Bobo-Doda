<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobo&amp;Doda — Onlayn xizmatlar bozori</title>
<meta name="description" content="Bobo&amp;Doda — mutaxassislar mahoratini sotadigan, buyurtmachilar ishonch bilan sotib oladigan onlayn bozor. To'lov kafolati bilan.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   Bobo&Doda — "Suzani Light" dizayn tili
   Oq mato ustiga yashil kashta: fon oq, naqsh va chok yashil ipda.
   oq = muhit · yashil = harakat · yashil chok = chiziq
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#FFFFFF;
  --bg-card:#FFFFFF;
  --bg-card-2:#F5FAF7;
  /* harakat rangi (tarixiy nom "yellow" — endi o'rmon yashil) */
  --yellow:#15803D;
  --yellow-soft:rgba(21,128,61,.10);
  /* urg'u (tarixiy nom "lime" — endi zaytun-lime) */
  --lime:#4D7C0F;
  --lime-soft:rgba(77,124,15,.10);
  /* chok ipi (tarixiy nom "red" — endi yashil chok) */
  --red:#15803D;
  --red-soft:rgba(21,128,61,.10);
  --on-action:#FFFFFF;
  --text:#0C1F16;
  --muted:#4C6156;
  --line:#DDEAE3;
  --radius:18px;
  --font-head:'Unbounded',sans-serif;
  --font-body:'Onest',sans-serif;
  --font-num:'JetBrains Mono',monospace;
  /* Yugurma chok (running stitch) — butun sahifaning imzo elementi */
  --stitch-h:repeating-linear-gradient(90deg,var(--red) 0 7px,transparent 7px 13px);
  --stitch-v:repeating-linear-gradient(180deg,var(--red) 0 7px,transparent 7px 13px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  overflow-x:hidden;
}
::selection{background:var(--yellow);color:var(--bg)}

/* ---------- Imzo: sahifani o'rab turgan qizil chok ---------- */
.frame{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
}
.frame::before,.frame::after{
  content:'';position:absolute;left:0;right:0;height:3px;background:var(--stitch-h);
}
.frame::before{top:0}
.frame::after{bottom:0}

/* ---------- Nav ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 48px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.logo{font-family:var(--font-head);font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none;color:var(--text)}
.logo span{color:var(--yellow)}
.nav-links{display:flex;gap:34px;list-style:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:15px;font-weight:500;transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{
  background:none;border:0;color:var(--muted);font-family:var(--font-body);
  font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;transition:.2s;
}
.lang button.active{background:var(--yellow);color:var(--bg)}
.btn{
  display:inline-block;font-family:var(--font-body);font-weight:600;font-size:15px;
  padding:11px 24px;border-radius:12px;text-decoration:none;cursor:pointer;border:0;
  transition:transform .2s,box-shadow .2s,filter .2s,border-color .2s,color .2s;
}
/* Sariq tugma — ostida qizil chiziq: qo'lda bo'yalgan bozor lavhasi */
.btn-primary{background:var(--yellow);color:var(--on-action);box-shadow:0 3px 0 0 #0E5C2C}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 0 0 #0E5C2C;filter:brightness(1.06)}
.btn-primary:active{transform:translateY(1px);box-shadow:0 2px 0 0 #0E5C2C}
.btn-ghost{color:var(--text);border:1px solid var(--line);background:transparent}
.btn-ghost:hover{border-color:var(--red);color:var(--yellow)}
.btn-lg{padding:15px 34px;font-size:16px;border-radius:14px}

/* ---------- Hero ---------- */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:140px 24px 90px;position:relative;overflow:hidden;width:100%;
}
/* Kashta gulchambari — konsentrik qizil halqalar (so'zana medalyoni) */
.hero-light{
  position:absolute;top:6%;left:50%;transform:translateX(-50%);
  width:min(880px,150vw);height:min(880px,150vw);pointer-events:none;max-width:110vw;
  background:
    repeating-radial-gradient(circle at 50% 50%,rgba(21,128,61,.22) 0 1.5px,transparent 1.5px 34px),
    radial-gradient(circle at 50% 50%,rgba(77,124,15,.07) 0%,transparent 62%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 72%);
  animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);background:var(--yellow-soft);
  color:var(--yellow);font-size:13px;font-weight:600;
  padding:7px 16px;border-radius:100px;margin-bottom:34px;position:relative;
}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--lime);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{
  font-family:var(--font-head);font-weight:800;font-size:clamp(34px,5vw,64px);
  line-height:1.14;letter-spacing:-.03em;max-width:1000px;position:relative;
}
h1 .accent{color:var(--yellow)}
.hero-sub{
  color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:660px;margin:26px auto 0;position:relative;
}
.hero-ctas{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap;justify-content:center;position:relative}

/* ---------- Escrow oqimi (imzo animatsiya) ---------- */
.escrow{margin-top:76px;width:min(760px,92vw);position:relative}
.escrow-track{display:flex;align-items:center;justify-content:space-between;position:relative}
/* Pul yo'li — chok ipi */
.escrow-line{
  position:absolute;left:70px;right:70px;top:50%;height:3px;transform:translateY(-50%);
  background:var(--stitch-h);
}
.node{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:140px;
}
.node-icon{
  width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-card);border:1px solid var(--line);
  box-shadow:0 8px 32px rgba(12,31,22,.12);
}
.node-icon svg{width:34px;height:34px;stroke:var(--lime);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.node.shield .node-icon{
  width:92px;height:92px;border-radius:26px;
  border-color:var(--red);background:var(--bg-card);
  animation:shieldPulse 6s ease-in-out infinite;
}
.node.shield .node-icon svg{stroke:var(--yellow);width:42px;height:42px}
@keyframes shieldPulse{
  0%,32%,100%{box-shadow:0 8px 32px rgba(12,31,22,.12)}
  42%,58%{box-shadow:0 0 0 4px var(--yellow-soft),0 0 0 5px var(--red)}
}
.node-label{font-size:13.5px;font-weight:600;color:var(--muted)}
.node.shield .node-label{color:var(--yellow)}
.coin{
  position:absolute;top:50%;left:78px;width:26px;height:26px;margin-top:-13px;z-index:3;
  border-radius:50%;background:var(--yellow);border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--bg);font-family:var(--font-num);
  animation:coinFlow 6s ease-in-out infinite;
}
@keyframes coinFlow{
  0%{left:78px;opacity:0;transform:scale(.6)}
  6%{opacity:1;transform:scale(1)}
  34%{left:calc(50% - 13px)}
  58%{left:calc(50% - 13px);background:var(--lime)}
  90%{left:calc(100% - 104px);opacity:1;transform:scale(1);background:var(--lime)}
  100%{left:calc(100% - 104px);opacity:0;transform:scale(.6);background:var(--lime)}
}
.escrow-caption{margin-top:26px;font-size:14px;color:var(--muted)}
.escrow-caption b{color:var(--yellow);font-weight:600}

/* ---------- Bo'limlar ---------- */
section{padding:110px 48px;max-width:1240px;margin:0 auto;position:relative}
.eyebrow{
  color:var(--lime);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:16px;display:flex;align-items:center;gap:12px;
}
.center .eyebrow{justify-content:center}
/* Eyebrow yonidagi qisqa chok — bo'lim boshlanishini bildiradi */
.eyebrow::after{content:'';flex:0 0 46px;height:3px;background:var(--stitch-h)}
h2{
  font-family:var(--font-head);font-weight:800;font-size:clamp(27px,3.3vw,44px);
  letter-spacing:-.03em;line-height:1.18;
}
h2 .accent{color:var(--yellow)}
.section-sub{color:var(--muted);font-size:17px;max-width:640px;margin-top:18px}
.center{text-align:center}
.center .section-sub{margin-left:auto;margin-right:auto}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

/* ---------- Ishonch kartasi ---------- */
.trust-card{
  margin-top:56px;border-radius:26px;padding:64px;position:relative;overflow:hidden;
  background:var(--bg-card);border:1px solid var(--line);
}
/* Tepadagi chok — kartaning kashta chekkasi */
.trust-card::before{
  content:'';position:absolute;top:0;left:26px;right:26px;height:3px;background:var(--stitch-h);
}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:54px}
.step-num{
  font-family:var(--font-num);font-weight:700;font-size:15px;color:var(--yellow);
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  background:var(--yellow-soft);
}
.step h3{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:-.02em;margin-bottom:10px}
.step p{color:var(--muted);font-size:15px}

/* ---------- Kategoriyalar ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px}
.cat{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 24px;transition:transform .25s,border-color .25s,background .25s;cursor:pointer;
}
.cat:hover{transform:translateY(-5px);border-color:var(--red);background:#F2F8F4}
.cat svg{width:30px;height:30px;stroke:var(--lime);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
.cat:hover svg{stroke:var(--yellow)}
.cat h3{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:-.02em;margin-bottom:6px}
.cat p{color:var(--muted);font-size:13.5px}

/* ---------- Auditoriyalar ---------- */
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:56px}
.aud{
  border-radius:26px;padding:48px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:var(--bg-card-2);
}
.aud::before{content:'';position:absolute;top:0;left:26px;right:26px;height:3px;background:var(--stitch-h)}
.aud .tag{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;display:block}
.aud.blue .tag{color:var(--yellow)}
.aud.cyan .tag{color:var(--lime)}
.aud h3{font-family:var(--font-head);font-weight:800;font-size:23px;margin-bottom:22px;letter-spacing:-.03em}
.aud ul{list-style:none;margin-bottom:34px}
.aud li{color:var(--muted);font-size:15.5px;padding-left:30px;position:relative;margin-bottom:13px}
.aud li::before{
  content:'';position:absolute;left:0;top:7px;width:16px;height:16px;
  border-radius:50%;background:var(--lime-soft);box-shadow:inset 0 0 0 1px var(--line);
}
.aud li::after{
  content:'';position:absolute;left:4.5px;top:11.5px;width:7px;height:4px;
  border-left:1.6px solid var(--lime);border-bottom:1.6px solid var(--lime);transform:rotate(-45deg);
}

/* ---------- Vaqt chizig'i ---------- */
.how-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:80px;margin-top:20px;align-items:start}
.how-sticky{position:sticky;top:140px}
.timeline{position:relative;padding-left:44px}
/* Tik chok — bosqichlarni bog'lab turgan ip */
.timeline::before{
  content:'';position:absolute;left:13px;top:8px;bottom:8px;width:3px;background:var(--stitch-v);
}
.t-item{position:relative;padding-bottom:52px}
.t-item:last-child{padding-bottom:0}
.t-dot{
  position:absolute;left:-44px;top:4px;width:28px;height:28px;border-radius:50%;
  background:var(--bg);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;
}
.t-dot::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.t-item .t-eyebrow{color:var(--lime);font-size:13px;font-weight:700;margin-bottom:5px}
.t-item h3{font-family:var(--font-head);font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:8px}
.t-item p{color:var(--muted);font-size:15px;max-width:440px}

/* ---------- Statistika ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px}
.stat{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:36px 28px;text-align:center;position:relative;
}
.stat::before{content:'';position:absolute;top:0;left:22px;right:22px;height:3px;background:var(--stitch-h)}
.stat .num{
  font-family:var(--font-num);font-weight:700;font-size:clamp(26px,2.6vw,36px);color:var(--text);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.stat .num span{color:var(--yellow)}
.stat p{color:var(--muted);font-size:14.5px;margin-top:6px}

/* ---------- FAQ ---------- */
.faq-list{max-width:780px;margin:56px auto 0}
.faq-item{border:1px solid var(--line);border-radius:16px;margin-bottom:14px;background:var(--bg-card-2);overflow:hidden}
.faq-item.open{border-color:var(--red)}
.faq-q{
  width:100%;background:none;border:0;color:var(--text);font-family:var(--font-body);
  font-size:16.5px;font-weight:600;text-align:left;padding:22px 26px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
}
.faq-q .chev{transition:transform .3s;color:var(--yellow);flex-shrink:0}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
.faq-a p{color:var(--muted);font-size:15px;padding:0 26px 24px}

/* ---------- Yakuniy CTA ---------- */
.final{
  text-align:center;border-radius:30px;padding:90px 48px;position:relative;overflow:hidden;
  background:var(--bg-card);border:1px solid var(--red);
}
/* To'liq kashta ramka: yuqori va past chok */
.final::before,.final::after{
  content:'';position:absolute;left:30px;right:30px;height:3px;background:var(--stitch-h);pointer-events:none;
}
.final::before{top:0}
.final::after{bottom:0}
.final h2,.final .section-sub,.final .hero-ctas{position:relative}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);padding:56px 48px 40px;max-width:1240px;margin:0 auto}
.foot-grid{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.foot-brand p{color:var(--muted);font-size:14px;max-width:300px;margin-top:14px}
.foot-col h4{font-family:var(--font-head);font-size:13px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.foot-col a{display:block;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:10px;transition:color .2s}
.foot-col a:hover{color:var(--yellow)}
.foot-bottom{
  margin-top:48px;padding-top:24px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  color:var(--muted);font-size:13.5px;
}

/* ---------- Sahifa yuklanish ketma-ketligi ---------- */
.load-seq{opacity:0;transform:translateY(18px);animation:loadIn .8s ease forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.32s}.d4{animation-delay:.46s}.d5{animation-delay:.62s}
@keyframes loadIn{to{opacity:1;transform:none}}

/* ---------- Hamburger va mobil menyu ---------- */
.hamburger{
  display:none;background:none;border:1px solid var(--line);border-radius:10px;
  width:42px;height:40px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px;transition:.3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{
  position:fixed;top:69px;left:0;right:0;z-index:99;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:16px 20px 22px;
  transform:translateY(-12px);opacity:0;pointer-events:none;transition:.28s ease;
}
.mobile-menu.open{transform:none;opacity:1;pointer-events:auto}
.mobile-menu a{
  color:var(--text);text-decoration:none;font-size:16px;font-weight:500;
  padding:13px 8px;border-radius:10px;transition:background .2s;
}
.mobile-menu a:hover{background:var(--yellow-soft)}
.mobile-menu .btn-primary{text-align:center;margin-top:10px;color:var(--on-action)}
.mobile-menu .btn-ghost{text-align:center;margin-top:10px}

/* ---------- Fokus va harakat ---------- */
a:focus-visible,button:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
  .load-seq{opacity:1;transform:none}
}

/* ══════════════════════════════════════════════════
   RESPONSIVE — laptop / planshet / telefon
   ══════════════════════════════════════════════════ */
@media (max-width:1200px){
  section{padding:100px 40px}
  .nav-links{gap:24px}
  .nav-links a{font-size:14px}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1024px){
  nav{padding:16px 28px}
  section{padding:90px 28px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .how-wrap{grid-template-columns:1fr;gap:52px}
  .how-sticky{position:static}
  .trust-card{padding:48px 40px}
  .steps{gap:28px}
  .aud{padding:40px 32px}
  footer{padding:52px 28px 36px}
}
@media (max-width:940px){
  .nav-links{display:none}
  .hamburger{display:flex}
}
@media (max-width:820px){
  section{padding:80px 20px}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .cat{padding:24px 20px}
  .steps{grid-template-columns:1fr;gap:32px}
  .aud-grid{grid-template-columns:1fr}
  .aud{padding:36px 26px}
  .trust-card{padding:40px 26px}
  .t-item p{max-width:none}
  .final{padding:64px 24px}
}
@media (max-width:640px){
  nav{padding:12px 16px}
  .logo{font-size:17px}
  .nav-cta{padding:9px 16px;font-size:14px}
  .nav-login{display:none}
  .lang button{padding:6px 10px;font-size:12px}
  .mobile-menu{top:61px}

  .hero{padding:120px 16px 70px}
  h1 br{display:none}
  .hero-sub{font-size:15.5px}
  .hero-ctas{flex-direction:column;width:100%;max-width:340px}
  .hero-ctas .btn{width:100%;text-align:center}
  .badge{font-size:12px;padding:6px 13px;margin-bottom:26px;text-align:left}

  .escrow{margin-top:56px}
  .node{width:88px}
  .node-icon{width:58px;height:58px;border-radius:15px}
  .node-icon svg{width:26px;height:26px}
  .node.shield .node-icon{width:70px;height:70px;border-radius:18px}
  .node.shield .node-icon svg{width:32px;height:32px}
  .node-label{font-size:12px}
  .escrow-line{left:44px;right:44px}

let lang = 'uz';

function renderFAQ(){
  const list = document.getElementById('faq-list');
  list.innerHTML = '';
  T[lang].faq.forEach(([q,a])=>{
    const item = document.createElement('div');
    item.className = 'faq-item';
    item.innerHTML = `
      <button class="faq-q" aria-expanded="false">${q}
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="faq-a"><p>${a}</p></div>`;
    const btn = item.querySelector('.faq-q');
    const ans = item.querySelector('.faq-a');
    btn.addEventListener('click',()=>{
      const open = item.classList.toggle('open');
      btn.setAttribute('aria-expanded',open);
      ans.style.maxHeight = open ? ans.scrollHeight+'px' : 0;
    });
    list.appendChild(item);
  });
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById('lang-uz').classList.toggle('active', l==='uz');
  document.getElementById('lang-ru').classList.toggle('active', l==='ru');
  document.getElementById('lang-en').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(T[l][k] !== undefined) el.textContent = T[l][k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k = el.getAttribute('data-i18n-html');
    if(T[l][k] !== undefined) el.innerHTML = T[l][k];
  });
  renderFAQ();
}

/* ================= Scroll reveal ================= */
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
  });
},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ================= Counters ================= */
const cio = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return;
    cio.unobserve(e.target);
    const el = e.target, target = +el.dataset.target, dur = 1600, t0 = performance.now();
    const fmt = n => n.toLocaleString('ru-RU').replace(/,/g,' ');
    function tick(t){
      const p = Math.min((t-t0)/dur,1);
      el.textContent = fmt(Math.round(target * (1-Math.pow(1-p,3))));
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
},{threshold:.4});
document.querySelectorAll('.counter').forEach(el=>cio.observe(el));

/* ================= Mobile menu ================= */
function toggleMenu(force){
  const menu = document.getElementById('mobile-menu');
  const btn = document.getElementById('hamburger');
  const open = force !== undefined ? force : !menu.classList.contains('open');
  menu.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
}
document.querySelectorAll('.mobile-menu a').forEach(a=>{
  a.addEventListener('click', ()=>toggleMenu(false));
});
window.addEventListener('resize', ()=>{
  if(window.innerWidth > 940) toggleMenu(false);
});
