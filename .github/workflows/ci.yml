name: CI / Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Content Security Policy (CSP)
        run: npm run check:csp

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  build:
    name: Production Build
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Summary
        run: |
          echo "### 🚀 CI / Verification Muvaffaqiyatli Tugadi" >> $GITHUB_STEP_SUMMARY
          echo "- **CSP Check:** ✅ O'tdi" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint:** ✅ O'tdi" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript:** ✅ O'tdi" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Build:** ✅ O'tdi" >> $GITHUB_STEP_SUMMARY
