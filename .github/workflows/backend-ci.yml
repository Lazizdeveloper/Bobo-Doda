name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Monorepo (npm workspaces): install va build ILDIZDAN. Dummy DB URL'lar —
# schema `directUrl` env talab qiladi; `prisma validate/generate` hech narsaga
# ULANMAYDI.
env:
  DATABASE_URL: postgresql://bobododa_app:app@localhost:5432/bobododa?schema=public
  DATABASE_MIGRATION_URL: postgresql://bobododa_migrator:migrator@localhost:5432/bobododa?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    name: Lint · Typecheck · Unit · Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces, root)
        run: npm ci

      - name: Prisma validate + generate
        run: |
          npm run prisma:generate --workspace backend
          npm exec --workspace backend -- prisma validate

      - name: Lint (backend)
        run: npm run lint --workspace backend

      - name: Typecheck (backend + contracts)
        run: npm run typecheck --workspace backend && npm run typecheck --workspace @bobododa/contracts

      - name: Unit tests (backend)
        run: npm run test:cov --workspace backend

      - name: Build (backend)
        run: npm run build --workspace backend

      - name: generate:contracts (OpenAPI → TS types + enums)
        run: |
          npm run generate:contracts
          git diff --stat -- packages/contracts || true
          test -s packages/contracts/openapi.json
          test -s packages/contracts/src/enums.ts

  integration:
    name: Integration (Testcontainers — real Postgres 16 + Redis)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces, root)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace backend

      - name: e2e — health + DB-role append-only (A4)
        run: npm run test:e2e --workspace backend
