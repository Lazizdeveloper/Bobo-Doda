# Netlify deploy sozlamasi
#
# MUHIM: bu Next.js App Router ilovasi. Bosh sahifa (`/`) oddiy Next.js route
# (`app/page.tsx`) — alohida rewrite/redirect shart emas. `@netlify/plugin-nextjs`
# SHART, aks holda `[id]` kabi dinamik marshrutlar ishlamaydi.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Xavfsizlik header'lari. `next.config.mjs` dagi CSP bilan BIR XIL bo'lishi
# shart — ikki fayl har xil bo'lsa, brauzer ikkala CSP'ning kesishmasini
# qo'llaydi va nosozlikni tushunish qiyinlashadi.
# Shriftlar `@fontsource` orqali LOKAL (self) — Google Fonts hostiga ruxsat
# kerak emas.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "off"
